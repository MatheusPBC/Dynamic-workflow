[project]
name = "drw"
version = "0.1.0"
description = "Dynamic Research Workflows"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.10.0"
]

[project.scripts]
drw = "drw.cli:main"
drw-mcp = "drw.mcp_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
